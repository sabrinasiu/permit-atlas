<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Construction Tracker — San Francisco</title><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="vendor/maplibre-gl.css"><link rel="stylesheet" href="style.css"></head>
<body><main><div id="map" aria-label="Interactive map of San Francisco new construction permits"></div>
<div class="floating-tools"><div class="search-card"><div class="brand"><span class="brandmark">▥</span><span>NEW CONSTRUCTION TRACKER</span><span class="city">SF</span></div><div class="search-wrap"><span>⌕</span><input id="search" aria-label="Search neighborhood" placeholder="Search neighborhood"><button id="clearSearch" aria-label="Clear search">×</button></div></div></div>
<button id="reset" class="map-button">⌖ <span>Reset view</span></button>

<div id="notice" role="status" hidden></div><div id="detail" hidden></div>
<section id="timeline" class="timeline phase-timeline mayor-timeline" aria-label="Mayoral term timeline" hidden>
<div class="timeline-header"><div><span class="eyebrow">PERMITS BY MAYOR</span><strong id="asOfLabel">Daniel Lurie</strong></div><div class="term-total"><strong id="phaseIssued">—</strong><span>permits issued</span></div></div>
<div id="mayorBlocks" class="mayor-blocks" role="group" aria-label="Select a mayoral term"></div>
<p id="termDates" class="term-period"></p><p id="timeExplanation">Select a mayor to see permits issued during their term.</p></section>
<div class="map-metadata"><span class="source"><span class="live-dot"></span><span id="sourceStatus">Loading DataSF snapshot…</span></span><button id="refresh" class="text-button">↻ Refresh from DataSF</button><a href="https://data.sf.gov/Housing-and-Buildings/Building-Permits/i98e-djp9/about_data" target="_blank" rel="noopener">DataSF ↗</a></div>
</main><script src="vendor/leaflet.js"></script><script src="vendor/maplibre-gl.js"></script><script src="vendor/leaflet-maplibre-gl.js"></script><script src="timeline.js"></script><script src="app.js"></script></body></html>
